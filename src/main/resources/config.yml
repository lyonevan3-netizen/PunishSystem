settings:
  database: punishments.db
  history-page-size: 45
  # These commands are blocked while muted. Root labels only; namespaced labels are checked too.
  muted-blocked-commands:
    - msg
    - tell
    - w
    - whisper
    - message
    - reply
    - r
    - me
    - mail
    - m
    - t
  messages:
    prefix: '&8[&cPunish&8] &7'
    no-permission: '&cYou do not have permission to do that.'
    player-not-found: '&cThat player has never joined this server.'
    punishment-issued: '&aPunishment issued successfully.'
    punishment-removed: '&aPunishment revoked successfully.'

# Format: ACTION:DURATION. Actions: MUTE, BAN, WARN. Durations: m, h, d, w, PERM.
# Steps escalate in order. The last step is capped indefinitely.
punishments:
  social:
    Spamming: ["MUTE:30m", "MUTE:2h", "MUTE:6h"]
    Minor toxicity: ["MUTE:1d", "MUTE:5d", "MUTE:14d"]
    Severe toxicity: ["MUTE:14d", "MUTE:30d", "MUTE:PERM"]
    Hate speech: ["MUTE:30d", "MUTE:PERM"]
    Unrelated content: ["MUTE:6h", "MUTE:3d", "MUTE:7d"]
    Advertising: ["MUTE:7d", "MUTE:30d", "MUTE:PERM"]
    External servers: ["MUTE:30d", "MUTE:PERM"]
    Inappropriate messages: ["MUTE:7d", "MUTE:14d", "MUTE:90d"]
    Explicit messages: ["MUTE:14d", "MUTE:30d", "MUTE:PERM"]
    Voice chat (abuse): ["MUTE:1h", "MUTE:12h", "MUTE:1d", "MUTE:3d", "MUTE:14d", "MUTE:30d"]
    Explicit threats: ["BAN:PERM"]
    Fishing: ["BAN:PERM"]
    Inappropriate username: ["BAN:PERM"]
  moderator:
    Misuse of helpop: ["WARN:0", "BAN:6h", "BAN:3d"]
    Mute Evasion: ["MUTE:PERM"]
    Ban evasion: ["BAN:PERM"]
    Compromised Account: ["BAN:PERM"]
    Minor Cheating: ["BAN:3d", "BAN:7d", "BAN:14d", "BAN:30d"]
    Cheating: ["BAN:7d", "BAN:14d", "BAN:30d", "BAN:PERM"]
    Bug abuse: ["BAN:3h", "BAN:1d", "BAN:3d", "BAN:7d", "BAN:30d"]
    Severe Bug Abuse: ["BAN:7d", "BAN:30d", "BAN:PERM"]
    Duping: ["BAN:PERM"]

discord:
  # Enable only after your Discord bot is hosted and reachable over HTTPS.
  enabled: false
  # Base URL only; the plugin appends /api/v1/punishments.
  bot-url: "https://YOUR-BOT-DOMAIN"
  # Must exactly match API_SECRET in the bot host's private environment variables.
  # Never share this value in chat, screenshots, or GitHub.
  shared-secret: "CHANGE-ME"
  # Used to make event IDs unique and stable across retries.
  server-id: "Robblestone"
